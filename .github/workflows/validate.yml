name: Validate portfolio files

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate notebook JSON if present
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          notebooks = list(Path(".").rglob("*.ipynb"))
          for path in notebooks:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"Validated {len(notebooks)} notebook JSON files.")
          PY
      - name: Reject common secret files
        run: |
          test -z "$(find . -type f \( -name '.env' -o -name '*.pem' -o -name '*.key' \) -not -path './.git/*' -print)"
